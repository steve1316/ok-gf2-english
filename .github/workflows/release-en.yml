name: Build release on demand

# The only release path for this fork. Upstream's build.yml was deleted here: its release job waited on
# a sync job that pushed to upstream's update repos with secrets this fork does not have.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version as YEAR.MMDD.N, e.g. 2026.1101.2. Leave blank for today (UTC) and the next free N.'
        required: false
        type: string
      prerelease:
        description: 'Mark the release as a pre-release'
        required: false
        default: false
        type: boolean

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    env:
      PYTHONIOENCODING: 'UTF-8'

    steps:
      - name: Configure git
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      # pyappify only sees tags matching ^v?\d+\.\d+\.\d+$, so no "en" marker can go in the tag name and a same-day
      # counter cannot be a fourth part. Versions are year.MMDD.N, where N counts releases on that UTC day. The parts
      # compare as numbers, so this stays clear of upstream's v1.2.x line and outranks the old year.MM.DD tags.
      # pyappify also seeds the offline installer by cloning git_url and checking out the newest release tag on the
      # remote, so a release is only correct when the tag being built is that newest tag. Tagging after the build
      # shipped a v2026.8.30 installer that held v2026.8.26 and updated itself on first launch.
      - name: Settle the tag and check it will be the newest on origin
        shell: pwsh
        run: |
          function Get-VersionKey($tag) {
            # pyappify compares the parts as numbers rather than as text, so pad them into a key that sorts the same way.
            return (($tag.TrimStart('v') -split '\.') | ForEach-Object { '{0:D6}' -f [int]$_ }) -join '.'
          }
          $refs = git ls-remote --tags origin 'refs/tags/v*'
          if ($LASTEXITCODE -ne 0) {
            Write-Error "git ls-remote failed, cannot read the tags on origin."
            exit 1
          }
          $names = @($refs) -replace '^\S+\s+refs/tags/', '' -replace '\^\{\}$', ''
          $version = "${{ inputs.version }}".Trim()
          if (-not $version) {
            $date = (Get-Date).ToUniversalTime().ToString('yyyy.MMdd')
            $taken = $names | ForEach-Object { if ($_ -match "^v$date\.(\d+)$") { [int]$Matches[1] } }
            $version = "$date.$([int]($taken | Measure-Object -Maximum).Maximum + 1)"
          }
          $parsed = [datetime]::MinValue
          if ($version -notmatch '^(\d{4}\.\d{4})\.[1-9]\d*$' -or
              -not [datetime]::TryParseExact($Matches[1], 'yyyy.MMdd', [cultureinfo]::InvariantCulture, 'None', [ref]$parsed)) {
            Write-Error "Version must look like 2026.1101.1, got '$version'."
            exit 1
          }
          $tag = "v$version"
          $tagKey = Get-VersionKey $tag
          $newer = @($names | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' -and (Get-VersionKey $_) -ge $tagKey } | Sort-Object -Unique)
          if ($newer) {
            Write-Error "origin already has $($newer -join ', '), which outrank or match $tag. Release a newer version."
            exit 1
          }
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Releasing as $tag, the newest tag on origin"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install cython setuptools polib

      - name: Run tests
        timeout-minutes: 10
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath tests -Filter "Test*.py" | Sort-Object Name | ForEach-Object {
            $module = "tests.$([System.IO.Path]::GetFileNameWithoutExtension($_.Name))"
            python -u -m unittest $module -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # pyappify re-reads pyappify.yml from the checked-out tree on every launch and replaces the
      # installed profile list with it, so a merge that brings back upstream's china / global profiles
      # would ship an installer that swaps itself for upstream's code. Fail the release instead.
      - name: Check pyappify.yml points at this fork
        shell: pwsh
        run: |
          $expected = "${{ github.server_url }}/${{ github.repository }}.git"
          $urls = Select-String -Path pyappify.yml -Pattern 'git_url:\s*"?([^"\s]+)"?' -AllMatches |
            ForEach-Object { $_.Matches } | ForEach-Object { $_.Groups[1].Value }
          if (-not $urls) {
            Write-Error "pyappify.yml declares no git_url."
            exit 1
          }
          foreach ($url in $urls) {
            if ($url -ne $expected) {
              Write-Error "pyappify.yml points at '$url', expected '$expected'."
              exit 1
            }
          }
          Write-Host "pyappify.yml points at $expected"
          Get-Content pyappify.yml

      # The tag goes up only once the tests have passed, but it has to be on origin before the build, since that
      # is where the clone pyappify seeds the installer from will look for it.
      - name: Create and push the tag
        id: push_tag
        shell: pwsh
        run: |
          $subject = (git log -1 --pretty=%s).Trim()
          git tag -a $env:TAG -m "$subject" HEAD && git push origin $env:TAG
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Could not put $env:TAG on origin."
            exit 1
          }
          Write-Host "Pushed $env:TAG at ${{ github.sha }}"

      # Does three jobs at once: writes the tag into src/config.py so the app reports its own version,
      # copies ok-script into the tree, and drops it from requirements.txt. The build needs all three.
      - name: inline_ok_requirements
        run: |
          python -m ok.update.inline_ok_requirements --tag ${{ env.TAG }}

      - name: Build
        uses: ok-oldking/pyappify-action@master

      - name: Add version to build filenames
        shell: pwsh
        run: |
          Get-ChildItem -Path pyappify_dist -File | ForEach-Object {
            Rename-Item -LiteralPath $_.FullName -NewName "$($_.BaseName)-${{ env.TAG }}$($_.Extension)"
          }
          Get-ChildItem -Path pyappify_dist

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          draft: false
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: pyappify_dist/**
          body: |
            Windows installers for the Global (Steam, English) client, built from `${{ github.ref_name }}`
            and released as `${{ env.TAG }}`.

            Download an installer below. Do not download the source archives - they do not include the
            packaged dependencies.

      # Deleting the tag here would race a re-run, so name the commands and leave the call to whoever is releasing.
      - name: Say how to remove the tag if the release failed
        if: failure() && steps.push_tag.outcome == 'success'
        shell: pwsh
        run: |
          Write-Host "::warning::$env:TAG is on origin with no release behind it, and AUTO_UPDATE clients follow tags. Remove it with: git push --delete origin $env:TAG"
