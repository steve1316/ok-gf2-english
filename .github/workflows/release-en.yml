name: Build release on demand

# The only release path for this fork. Upstream's build.yml was deleted here: its release job waited on
# a sync job that pushed to upstream's update repos with secrets this fork does not have.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version as YEAR.MMDD.N, e.g. 2026.1101.2. Leave blank for today (UTC) and the next free N.'
        required: false
        type: string
      prerelease:
        description: 'Mark the release as a pre-release'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Build the newest existing tag without pushing a tag or publishing a release. The installers are kept as a workflow artifact, and a launcher it had to build is still committed.'
        required: false
        default: false
        type: boolean

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    env:
      PYTHONIOENCODING: 'UTF-8'
      # Pinned rather than following PyAppify's newest release, because the launcher committed under launcher/ is built
      # from this version. Bumping it makes the next run rebuild the launcher once and commit the new one.
      PYAPPIFY_VERSION: 'v1.2.9'
      # Pinned rather than @master: the committed launcher relies on the action skipping its build when it finds a
      # launcher already in its build folder, and on the prepare step below matching how the action lays that folder
      # out. Bump it here and in the Build step together.
      PYAPPIFY_ACTION_SHA: 'a987e9ade9d7517f97b38636c0e07b44fd5ef379'

    steps:
      - name: Configure git
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      # pyappify only sees tags matching ^v?\d+\.\d+\.\d+$, so no "en" marker can go in the tag name and a same-day
      # counter cannot be a fourth part. Versions are year.MMDD.N, where N counts releases on that UTC day. The parts
      # compare as numbers, so this stays clear of upstream's v1.2.x line and outranks the old year.MM.DD tags.
      # pyappify also seeds the offline installer by cloning git_url and checking out the newest release tag on the
      # remote, so a release is only correct when the tag being built is that newest tag. Tagging after the build
      # shipped a v2026.8.30 installer that held v2026.8.26 and updated itself on first launch.
      - name: Settle the tag and check it will be the newest on origin
        shell: pwsh
        run: |
          function Get-VersionKey($tag) {
            # pyappify compares the parts as numbers rather than as text, so pad them into a key that sorts the same way.
            return (($tag.TrimStart('v') -split '\.') | ForEach-Object { '{0:D6}' -f [int]$_ }) -join '.'
          }
          $refs = git ls-remote --tags origin 'refs/tags/v*'
          if ($LASTEXITCODE -ne 0) {
            Write-Error "git ls-remote failed, cannot read the tags on origin."
            exit 1
          }
          $names = @($refs) -replace '^\S+\s+refs/tags/', '' -replace '\^\{\}$', ''
          # A dry run rebuilds the newest tag already on origin, so there is nothing to settle or check.
          if ("${{ inputs.dry_run }}" -eq 'true') {
            $tag = $names | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } | Sort-Object { Get-VersionKey $_ } -Unique | Select-Object -Last 1
            if (-not $tag) {
              Write-Error "origin has no version tag to rebuild."
              exit 1
            }
            "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "Dry run: rebuilding $tag without tagging or releasing"
            exit 0
          }
          $version = "${{ inputs.version }}".Trim()
          if (-not $version) {
            $date = (Get-Date).ToUniversalTime().ToString('yyyy.MMdd')
            $taken = $names | ForEach-Object { if ($_ -match "^v$date\.(\d+)$") { [int]$Matches[1] } }
            $version = "$date.$([int]($taken | Measure-Object -Maximum).Maximum + 1)"
          }
          $parsed = [datetime]::MinValue
          if ($version -notmatch '^(\d{4}\.\d{4})\.[1-9]\d*$' -or
              -not [datetime]::TryParseExact($Matches[1], 'yyyy.MMdd', [cultureinfo]::InvariantCulture, 'None', [ref]$parsed)) {
            Write-Error "Version must look like 2026.1101.1, got '$version'."
            exit 1
          }
          $tag = "v$version"
          $tagKey = Get-VersionKey $tag
          $newer = @($names | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' -and (Get-VersionKey $_) -ge $tagKey } | Sort-Object -Unique)
          if ($newer) {
            Write-Error "origin already has $($newer -join ', '), which outrank or match $tag. Release a newer version."
            exit 1
          }
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Releasing as $tag, the newest tag on origin"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # Keeps the wheels pip builds from sdists (pyautogui and friends), most of what this install spent its time on.
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install cython setuptools polib

      - name: Run tests
        timeout-minutes: 10
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath tests -Filter "Test*.py" | Sort-Object Name | ForEach-Object {
            $module = "tests.$([System.IO.Path]::GetFileNameWithoutExtension($_.Name))"
            python -u -m unittest $module -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # pyappify re-reads pyappify.yml from the checked-out tree on every launch and replaces the
      # installed profile list with it, so a merge that brings back upstream's china / global profiles
      # would ship an installer that swaps itself for upstream's code. Fail the release instead.
      - name: Check pyappify.yml points at this fork
        shell: pwsh
        run: |
          $expected = "${{ github.server_url }}/${{ github.repository }}.git"
          $urls = Select-String -Path pyappify.yml -Pattern 'git_url:\s*"?([^"\s]+)"?' -AllMatches |
            ForEach-Object { $_.Matches } | ForEach-Object { $_.Groups[1].Value }
          if (-not $urls) {
            Write-Error "pyappify.yml declares no git_url."
            exit 1
          }
          foreach ($url in $urls) {
            if ($url -ne $expected) {
              Write-Error "pyappify.yml points at '$url', expected '$expected'."
              exit 1
            }
          }
          Write-Host "pyappify.yml points at $expected"
          Get-Content pyappify.yml

      # The tag goes up only once the tests have passed, but it has to be on origin before the build, since that
      # is where the clone pyappify seeds the installer from will look for it.
      - name: Create and push the tag
        id: push_tag
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        run: |
          $subject = (git log -1 --pretty=%s).Trim()
          git tag -a $env:TAG -m "$subject" HEAD && git push origin $env:TAG
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Could not put $env:TAG on origin."
            exit 1
          }
          Write-Host "Pushed $env:TAG at ${{ github.sha }}"

      # Does three jobs at once: writes the tag into src/config.py so the app reports its own version,
      # copies ok-script into the tree, and drops it from requirements.txt. The build needs all three.
      - name: inline_ok_requirements
        run: |
          python -m ok.update.inline_ok_requirements --tag ${{ env.TAG }}

      # Compiling the launcher was 11 of the run's 22 minutes, and it comes out the same every time, so the built launcher
      # is committed under launcher/. key.txt beside it records everything compiled into it. When that still matches,
      # the run lays out PyAppify's build folder around the committed launcher and the action goes straight to the
      # installers. When it does not, the action builds a new launcher and the last step commits it.
      - name: Check the committed launcher
        shell: pwsh
        run: |
          $name = (Select-String -LiteralPath pyappify.yml -Pattern '^name:\s*"?([^"\s]+)"?').Matches[0].Groups[1].Value
          $key = @(
            "pyappify $env:PYAPPIFY_VERSION"
            "action $env:PYAPPIFY_ACTION_SHA"
            foreach ($path in 'pyappify.yml', 'icons', 'icon.ico') { "$path $(git rev-parse "HEAD:$path")" }
          ) -join "`n"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Could not read the launcher's inputs from the checkout."
            exit 1
          }
          [IO.File]::WriteAllText("$env:RUNNER_TEMP/launcher-key.txt", "$key`n")
          $committed = ''
          if (Test-Path -LiteralPath launcher/key.txt) { $committed = (Get-Content -LiteralPath launcher/key.txt -Raw).Replace("`r", '').Trim() }
          $reuse = ($committed -eq $key) -and (Test-Path -LiteralPath "launcher/$name.exe")
          "APP_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LAUNCHER_COMMITTED=$($reuse.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if ($reuse) {
            Write-Host "Reusing the committed launcher, built from:`n$key"
          } else {
            Write-Host "The committed launcher was built from:`n$(if ($committed) { $committed } else { '(nothing committed)' })"
            Write-Host "This run needs one built from:`n$key`nso it builds the launcher and commits it at the end."
          }

      # The Tauri CLI runs through pnpm whether the launcher is built or reused. This takes seconds, and the action
      # skips its own `npm install -g pnpm`, which took 80, when pnpm is already there.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      # What the action does before compiling, which it skips when it finds a launcher: clone PyAppify, copy in
      # pyappify.yml and the icons, and put the app's name into its configs. tauri.conf.json goes through the action's
      # own helper so it matches. The build.rs UAC edit only matters to the compile, so it is left out.
      - name: Lay out the build folder around the committed launcher
        if: env.LAUNCHER_COMMITTED == 'true'
        shell: node {0}
        run: |
          const { execFileSync } = require('child_process');
          const fs = require('fs');
          const path = require('path');
          const { APP_NAME: appName, PYAPPIFY_VERSION: version, PYAPPIFY_ACTION_SHA: sha } = process.env;
          const actionDir = path.join(path.dirname(process.env.RUNNER_WORKSPACE), '_actions', 'ok-oldking', 'pyappify-action', sha);
          if (!fs.existsSync(actionDir)) throw new Error(`The Build step's action is not at ${actionDir}.`);
          const { getMainBinaryName, prepareTauriConfig } = require(path.join(actionDir, 'build-config.js'));
          const buildDir = path.join(process.env.RUNNER_TEMP, 'p');
          execFileSync('git', ['clone', '--quiet', '--depth', '1', '--branch', version, 'https://github.com/ok-oldking/pyappify.git', buildDir], { stdio: 'inherit' });
          const srcTauri = path.join(buildDir, 'src-tauri');
          const edit = (file, change) => fs.writeFileSync(file, change(fs.readFileSync(file, 'utf8')));
          fs.copyFileSync('pyappify.yml', path.join(srcTauri, 'assets', 'pyappify.yml'));
          fs.cpSync('icons', path.join(srcTauri, 'icons'), { recursive: true });
          edit(path.join(srcTauri, 'tauri.conf.json'), text => prepareTauriConfig(text, appName, version));
          edit(path.join(srcTauri, 'Cargo.toml'), text => text.replace(/name = "pyappify"/g, `name = "${appName}"`));
          edit(path.join(buildDir, 'package.json'), text => {
            const pkg = JSON.parse(text);
            const built = new Set([...((pkg.pnpm || {}).onlyBuiltDependencies || []), 'esbuild']);
            pkg.pnpm = { ...pkg.pnpm, onlyBuiltDependencies: [...built].sort() };
            return `${JSON.stringify(pkg, null, 2)}\n`;
          });
          const exe = `${getMainBinaryName(appName)}.exe`;
          const release = path.join(srcTauri, 'target', 'release');
          fs.mkdirSync(release, { recursive: true });
          fs.copyFileSync(path.join('launcher', exe), path.join(release, exe));
          console.log(`Placed launcher/${exe} in a PyAppify ${version} build folder at ${buildDir}`);

      - name: Install PyAppify's build tools
        if: env.LAUNCHER_COMMITTED == 'true'
        working-directory: ${{ runner.temp }}/p
        run: pnpm install

      - name: Build
        # Keep in step with PYAPPIFY_ACTION_SHA above.
        uses: ok-oldking/pyappify-action@a987e9ade9d7517f97b38636c0e07b44fd5ef379
        with:
          version: ${{ env.PYAPPIFY_VERSION }}
          app_version: ${{ env.TAG }}

      - name: Add version to build filenames
        shell: pwsh
        run: |
          Get-ChildItem -Path pyappify_dist -File | ForEach-Object {
            Rename-Item -LiteralPath $_.FullName -NewName "$($_.BaseName)-${{ env.TAG }}$($_.Extension)"
          }
          Get-ChildItem -Path pyappify_dist

      - name: Keep the dry run's installers
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ env.TAG }}
          path: pyappify_dist/**
          retention-days: 3

      - name: Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          draft: false
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: pyappify_dist/**
          body: |
            Windows installers for the Global (Steam, English) client, built from `${{ github.ref_name }}`
            and released as `${{ env.TAG }}`.

            Download an installer below. Do not download the source archives - they do not include the
            packaged dependencies.

      # A launcher this run built goes back to the branch the run came from, so the next run reuses it. The release is
      # already out by now, so a failure here only warns rather than failing the run and pointing at the tag.
      - name: Commit the new launcher
        if: env.LAUNCHER_COMMITTED == 'false' && github.ref_type == 'branch'
        shell: pwsh
        run: |
          $branch = '${{ github.ref_name }}'
          $exe = "$env:RUNNER_TEMP/p/src-tauri/target/release/$env:APP_NAME.exe"
          $tree = "$env:RUNNER_TEMP/launcher-commit"
          git fetch --quiet origin $branch
          git worktree add --quiet --detach $tree FETCH_HEAD
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::Could not check out $branch to commit the new launcher. The next run will build it again."
            exit 0
          }
          New-Item -ItemType Directory -Force -Path "$tree/launcher" | Out-Null
          Copy-Item -LiteralPath $exe -Destination "$tree/launcher/$env:APP_NAME.exe" -Force
          Copy-Item -LiteralPath "$env:RUNNER_TEMP/launcher-key.txt" -Destination "$tree/launcher/key.txt" -Force
          git -C $tree add launcher
          git -C $tree commit --quiet -m "Update the committed PyAppify launcher to $env:PYAPPIFY_VERSION"
          git -C $tree push --quiet origin "HEAD:refs/heads/$branch"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::Could not push the new launcher to $branch. The next run will build it again."
            exit 0
          }
          Write-Host ("Committed launcher/{0}.exe ({1:N1} MB) to {2}" -f $env:APP_NAME, ((Get-Item -LiteralPath $exe).Length / 1MB), $branch)

      # Deleting the tag here would race a re-run, so name the commands and leave the call to whoever is releasing.
      - name: Say how to remove the tag if the release failed
        if: failure() && steps.push_tag.outcome == 'success'
        shell: pwsh
        run: |
          Write-Host "::warning::$env:TAG is on origin with no release behind it, and AUTO_UPDATE clients follow tags. Remove it with: git push --delete origin $env:TAG"
