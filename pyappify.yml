name: "ok-gf2"
# Brands the shortcut that runs the app. The icons/ directory only brands the launcher exe, so without this
# the app shortcut falls back to the icon of the pythonw.exe it targets and shows up as a plain Python file.
# Read into the launcher at build time, so a change here needs a new installer rather than an app update.
icon: "icon.ico"
uac: true
profiles:
  - name: "en"
    git_url: "https://github.com/steve1316/ok-gf2-english.git"
    admin: true
    main_script: "main.py"
    requires_python: "3.12"
    requirements: "requirements.txt"
    use_pythonw: true
    show_add_defender: true
